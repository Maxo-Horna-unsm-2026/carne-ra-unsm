<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Carné aumentado UNSM</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

    /* ---------- Pantalla de inicio ---------- */
    #inicio {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at 50% 30%, #17406f 0%, #0b2545 70%);
      color: #fff; text-align: center; padding: 28px;
    }
    #inicio img { width: 120px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); animation: flotar 3s ease-in-out infinite; }
    #inicio h1 { margin: 6px 0 0; font-size: 26px; }
    #inicio p { margin: 0; opacity: .85; max-width: 320px; line-height: 1.45; }
    #btnIniciar {
      margin-top: 10px; font-size: 18px; font-weight: 700; padding: 14px 34px;
      border: 0; border-radius: 999px; background: #f4b400; color: #0b2545;
      box-shadow: 0 6px 18px rgba(244,180,0,.4);
    }
    #inicio small { opacity: .6; margin-top: 8px; }
    @keyframes flotar { 50% { transform: translateY(-10px); } }

    /* ---------- Avisos ---------- */
    .aviso {
      position: fixed; left: 50%; z-index: 20; transition: transform .35s ease;
      background: #0b2545; color: #fff; border: 2px solid #f4b400;
      padding: 10px 18px; border-radius: 999px; font-weight: 600; white-space: nowrap;
    }
    #aviso { top: 18px; transform: translate(-50%, -90px); }
    #aviso.visible { transform: translate(-50%, 0); }
    #ayuda { bottom: 22px; transform: translate(-50%, 120px); background: rgba(11,37,69,.9); font-weight: 500; }
    #ayuda.visible { transform: translate(-50%, 0); }

    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>

  <script>
    const THREE = AFRAME.THREE;

    /* Pone una imagen en la cara de adelante (y atrás) de una caja o cilindro, y color en los lados */
    const cacheTexturas = {};
    function textura(url, espejo) {
      const clave = url + (espejo ? '#e' : '');
      if (!cacheTexturas[clave]) {
        const t = new THREE.TextureLoader().load(url);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        if (espejo) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; }
        cacheTexturas[clave] = t;
      }
      return cacheTexturas[clave];
    }
    AFRAME.registerComponent('caras', {
      schema: {
        frente: { default: '' }, atras: { default: '' },
        lado: { type: 'color', default: '#f4b400' },
        metal: { default: 0.3 }, rugosidad: { default: 0.45 }
      },
      init() {
        this.aplicar = this.aplicar.bind(this);
        this.el.addEventListener('object3dset', this.aplicar);
        this.aplicar();
      },
      aplicar() {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) return;
        const d = this.data;
        const lado = new THREE.MeshStandardMaterial({ color: d.lado, metalness: d.metal, roughness: d.rugosidad });
        const cara = (url, espejo) => url
          ? new THREE.MeshStandardMaterial({ map: textura(url, espejo), roughness: 0.6, metalness: 0 })
          : lado;
        if (mesh.geometry.type === 'CylinderGeometry') {
          mesh.material = [lado, cara(d.frente), cara(d.atras, true)];      // lado, tapa de arriba, tapa de abajo
        } else {
          mesh.material = [lado, lado, lado, lado, cara(d.frente), cara(d.atras)]; // +x,-x,+y,-y,+z(frente),-z(atrás)
        }
      }
    });

    /* Estabilizador: el contenido sigue al carné suavemente y se queda QUIETO si el carné casi no se mueve */
    AFRAME.registerComponent('seguir-suave', {
      schema: {
        objetivo: { type: 'selector' },
        rapidez: { default: 6 },      // más alto = sigue más rápido, más bajo = más suave
        zonaPos: { default: 0.03 },   // movimiento ignorado (fracción del ancho del carné)
        zonaRot: { default: 3 }       // giro ignorado (grados)
      },
      init() {
        this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3();
        this.siguiendo = false; this.moviendo = false; this.saltar = true;
        this.el.object3D.visible = false;
      },
      seguir(saltar) { this.siguiendo = true; if (saltar) this.saltar = true; },
      detener() { this.siguiendo = false; },
      tick(t, dt) {
        if (!this.siguiendo || !dt) return;
        const o = this.data.objetivo.object3D;
        o.updateMatrixWorld(true);
        o.matrixWorld.decompose(this.p, this.q, this.s);
        if (!this.s.x) return;
        const yo = this.el.object3D;
        if (this.saltar) {
          yo.position.copy(this.p); yo.quaternion.copy(this.q); yo.scale.copy(this.s);
          this.saltar = false; this.moviendo = false; return;
        }
        const dist = yo.position.distanceTo(this.p) / this.s.x;
        const ang = THREE.MathUtils.radToDeg(yo.quaternion.angleTo(this.q));
        if (!this.moviendo && dist < this.data.zonaPos && ang < this.data.zonaRot) return; // quieto
        this.moviendo = true;
        const a = 1 - Math.exp(-this.data.rapidez * Math.min(dt, 100) / 1000);
        yo.position.lerp(this.p, a); yo.quaternion.slerp(this.q, a); yo.scale.lerp(this.s, a);
        if (dist < 0.004 && ang < 0.4) this.moviendo = false;                              // llegó: se vuelve a quedar quieto
      }
    });
  </script>
</head>
<body>
  <div id="inicio">
    <img src="./escudo.png" alt="Escudo UNSM">
    <h1>Carné aumentado UNSM</h1>
    <p>Toca <b>Comenzar</b>, permite el uso de la cámara y apunta a la parte delantera de tu carné universitario.</p>
    <button id="btnIniciar">Comenzar</button>
    <small>Ingeniería de Sistemas e Informática</small>
  </div>

  <div id="aviso" class="aviso">✅ Carné detectado</div>
  <div id="ayuda" class="aviso">👆 Toca un botón para abrirlo</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8"
    color-space="sRGB" renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img src="./3d-medalla.jpg"><img src="./3d-panel.jpg"><img src="./3d-pantalla.jpg"><img src="./3d-teclado.jpg">
      <img id="etqIntranet" src="./3d-etiqueta-intranet.png"><img id="etqAula" src="./3d-etiqueta-aula.png">
      <img id="etqBiblioteca" src="./3d-etiqueta-biblioteca.png"><img id="etqWeb" src="./3d-etiqueta-web.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .tocable"></a-camera>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>

    <!-- El carné detectado (MindAR lo mueve aquí; está vacío) -->
    <a-entity id="carne" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- ====== LA MAQUETA ======
         El carné es el PISO. Medidas: el carné mide 1 de ancho (x) y 0,635 de fondo (y).
         Centro del carné = (0,0,0). "z" es la ALTURA sobre el carné.
         El borde de abajo del carné (y negativo) es el lado del espectador. -->
    <a-entity id="contenido" seguir-suave="objetivo: #carne">

      <!-- Luz tipo "sol" fija a la maqueta (las sombras de brillo no cambian al mover el celular) -->
      <a-entity id="centroLuz" position="0 0 0"></a-entity>
      <a-entity light="type: directional; intensity: 0.85; target: #centroLuz" position="-0.6 -1 1.6"></a-entity>

      <!-- Marco dorado en el borde del carné -->
      <a-entity class="anim reiniciar" data-escala="0.001 0.001 0.001" scale="0.001 0.001 0.001"
        animation__abrir="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 500; easing: easeOutQuad; startEvents: aparecer">
        <a-plane color="#f4b400" shader="flat" width="1.04" height="0.02" position="0 0.3275 0.002"></a-plane>
        <a-plane color="#f4b400" shader="flat" width="1.04" height="0.02" position="0 -0.3275 0.002"></a-plane>
        <a-plane color="#f4b400" shader="flat" width="0.02" height="0.675" position="0.51 0 0.002"></a-plane>
        <a-plane color="#f4b400" shader="flat" width="0.02" height="0.675" position="-0.51 0 0.002"></a-plane>
      </a-entity>

      <!-- Línea de escaneo -->
      <a-plane class="anim" color="#f4b400" shader="flat" width="1" height="0.025" position="0 0.31 0.004"
        material="transparent: true; opacity: 0"
        animation__bajar="property: position; from: 0 0.31 0.004; to: 0 -0.31 0.004; dur: 900; easing: easeInOutQuad; startEvents: aparecer"
        animation__brillo="property: material.opacity; from: 0.85; to: 0; dur: 900; easing: easeInQuad; startEvents: aparecer"></a-plane>

      <!-- Anillo de luz que se expande desde el centro (de aquí "nacen" los objetos) -->
      <a-image class="anim" src="./3d-portal.png" transparent="true" width="1" height="1" position="0 0 0.006" scale="0.01 0.01 0.01"
        material="opacity: 0; depthWrite: false"
        animation__crecer="property: scale; from: 0.05 0.05 1; to: 1.1 1.1 1; dur: 1100; delay: 400; easing: easeOutCubic; startEvents: aparecer"
        animation__brillo="property: material.opacity; from: 1; to: 0; dur: 1100; delay: 400; easing: easeInQuad; startEvents: aparecer"></a-image>

      <!-- 1) LETRERO de la facultad, de pie al fondo del carné, sobre dos postes -->
      <a-entity class="anim reiniciar" data-escala="0.3 0.3 0.01" position="0 0.24 0" scale="0.3 0.3 0.01"
        animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 900; delay: 1400; easing: easeOutBack; startEvents: aparecer">
        <a-image src="./3d-sombra.png" transparent="true" width="1.05" height="0.16" position="0 0 0.003" material="depthWrite: false"></a-image>
        <a-entity geometry="primitive: cylinder; radius: 0.012; height: 0.34" rotation="90 0 0" position="-0.4 0 0.17" caras="lado: #f4b400; metal: 0.7; rugosidad: 0.3"></a-entity>
        <a-entity geometry="primitive: cylinder; radius: 0.012; height: 0.34" rotation="90 0 0" position="0.4 0 0.17" caras="lado: #f4b400; metal: 0.7; rugosidad: 0.3"></a-entity>
        <a-entity geometry="primitive: box; width: 0.95; height: 0.4; depth: 0.035" rotation="90 0 0" position="0 0 0.53"
          caras="frente: ./3d-panel.jpg; lado: #0b2545; metal: 0.2"></a-entity>
      </a-entity>

      <!-- 2) MEDALLA con el escudo: de pie, girando sobre su eje -->
      <a-entity class="anim reiniciar" data-escala="0.3 0.3 0.01" position="-0.27 -0.03 0" scale="0.3 0.3 0.01"
        animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 1000; delay: 500; easing: easeOutBack; startEvents: aparecer">
        <a-image src="./3d-sombra.png" transparent="true" width="0.36" height="0.2" position="0 0 0.003" material="depthWrite: false"></a-image>
        <a-entity position="0 0 0.2"
          animation__girar="property: rotation; from: 0 0 0; to: 0 0 360; dur: 7000; loop: true; easing: linear">
          <a-entity rotation="90 0 0">
            <a-entity geometry="primitive: cylinder; radius: 0.16; height: 0.045; segmentsRadial: 64" rotation="90 0 0"
              caras="lado: #f4b400; metal: 0.75; rugosidad: 0.3"></a-entity>
            <a-circle radius="0.158" segments="64" position="0 0 0.0235" material="src: ./3d-medalla.jpg; shader: standard; roughness: 0.6"></a-circle>
            <a-circle radius="0.158" segments="64" position="0 0 -0.0235" rotation="0 180 0" material="src: ./3d-medalla.jpg; shader: standard; roughness: 0.6"></a-circle>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- 3) LAPTOP sobre el carné: aparece cerrada y se abre -->
      <a-entity class="anim reiniciar" data-escala="0.3 0.3 0.01" position="0.25 -0.04 0" rotation="0 0 -15" scale="0.3 0.3 0.01"
        animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 700; delay: 800; easing: easeOutBack; startEvents: aparecer">
        <a-image src="./3d-sombra.png" transparent="true" width="0.48" height="0.36" position="0 0 0.003" material="depthWrite: false"></a-image>
        <a-entity geometry="primitive: box; width: 0.36; height: 0.24; depth: 0.02" position="0 0 0.012"
          caras="frente: ./3d-teclado.jpg; lado: #9aa0a8; metal: 0.6"></a-entity>
        <a-entity class="anim reiniciar" data-rot="0 0 0" position="0 0.12 0.022"
          animation__abrir="property: rotation; from: 0 0 0; to: -105 0 0; dur: 1300; delay: 1300; easing: easeOutBack; startEvents: aparecer">
          <a-entity geometry="primitive: box; width: 0.36; height: 0.23; depth: 0.012" position="0 -0.115 0.007" rotation="0 0 180"
            caras="atras: ./3d-pantalla.jpg; lado: #9aa0a8; metal: 0.6"></a-entity>
        </a-entity>
      </a-entity>

      <!-- 4) BOTONES: monedas flotando delante del carné. Para cambiar un link, edita data-url -->
        <a-entity class="boton anim reiniciar" data-escala="0.3 0.3 0.01" position="-0.36 -0.46 0" scale="0.3 0.3 0.01"
          animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 700; delay: 1900; easing: easeOutBack; startEvents: aparecer">
          <a-image src="./3d-sombra.png" transparent="true" width="0.2" height="0.12" position="0 0 0.003" material="depthWrite: false"></a-image>
          <a-image src="#etqIntranet" transparent="true" side="double" width="0.147" height="0.045" position="0 -0.02 0.035" rotation="90 0 0"></a-image>
          <a-entity position="0 0 0.16"
            animation__flotar="property: position; from: 0 0 0.15; to: 0 0 0.17; dur: 1400; delay: 0; dir: alternate; loop: true; easing: easeInOutSine">
            <a-entity rotation="90 0 0" data-url="https://sigauintranet.unsm.edu.pe/"
              animation__balanceo="property: rotation; from: 90 -25 0; to: 90 25 0; dur: 1700; delay: 0; dir: alternate; loop: true; easing: easeInOutSine">
              <a-entity class="tocable" geometry="primitive: cylinder; radius: 0.08; height: 0.035; segmentsRadial: 48" rotation="90 0 0"
                caras="lado: #00953a; metal: 0.4"></a-entity>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 0.018" material="src: ./3d-boton-intranet.jpg; shader: standard; roughness: 0.6"></a-circle>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 -0.018" rotation="0 180 0" material="src: ./3d-boton-intranet.jpg; shader: standard; roughness: 0.6"></a-circle>
            </a-entity>
          </a-entity>
        </a-entity>
        <a-entity class="boton anim reiniciar" data-escala="0.3 0.3 0.01" position="-0.12 -0.46 0" scale="0.3 0.3 0.01"
          animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 700; delay: 2050; easing: easeOutBack; startEvents: aparecer">
          <a-image src="./3d-sombra.png" transparent="true" width="0.2" height="0.12" position="0 0 0.003" material="depthWrite: false"></a-image>
          <a-image src="#etqAula" transparent="true" side="double" width="0.200" height="0.045" position="0 -0.02 0.035" rotation="90 0 0"></a-image>
          <a-entity position="0 0 0.16"
            animation__flotar="property: position; from: 0 0 0.15; to: 0 0 0.17; dur: 1400; delay: 200; dir: alternate; loop: true; easing: easeInOutSine">
            <a-entity rotation="90 0 0" data-url="https://campusvirtualpregrado.unsm.edu.pe/"
              animation__balanceo="property: rotation; from: 90 -25 0; to: 90 25 0; dur: 1700; delay: 250; dir: alternate; loop: true; easing: easeInOutSine">
              <a-entity class="tocable" geometry="primitive: cylinder; radius: 0.08; height: 0.035; segmentsRadial: 48" rotation="90 0 0"
                caras="lado: #00953a; metal: 0.4"></a-entity>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 0.018" material="src: ./3d-boton-aula.jpg; shader: standard; roughness: 0.6"></a-circle>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 -0.018" rotation="0 180 0" material="src: ./3d-boton-aula.jpg; shader: standard; roughness: 0.6"></a-circle>
            </a-entity>
          </a-entity>
        </a-entity>
        <a-entity class="boton anim reiniciar" data-escala="0.3 0.3 0.01" position="0.12 -0.46 0" scale="0.3 0.3 0.01"
          animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 700; delay: 2200; easing: easeOutBack; startEvents: aparecer">
          <a-image src="./3d-sombra.png" transparent="true" width="0.2" height="0.12" position="0 0 0.003" material="depthWrite: false"></a-image>
          <a-image src="#etqBiblioteca" transparent="true" side="double" width="0.177" height="0.045" position="0 -0.02 0.035" rotation="90 0 0"></a-image>
          <a-entity position="0 0 0.16"
            animation__flotar="property: position; from: 0 0 0.15; to: 0 0 0.17; dur: 1400; delay: 400; dir: alternate; loop: true; easing: easeInOutSine">
            <a-entity rotation="90 0 0" data-url="http://biblioteca.unsm.edu.pe/"
              animation__balanceo="property: rotation; from: 90 -25 0; to: 90 25 0; dur: 1700; delay: 500; dir: alternate; loop: true; easing: easeInOutSine">
              <a-entity class="tocable" geometry="primitive: cylinder; radius: 0.08; height: 0.035; segmentsRadial: 48" rotation="90 0 0"
                caras="lado: #00953a; metal: 0.4"></a-entity>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 0.018" material="src: ./3d-boton-biblioteca.jpg; shader: standard; roughness: 0.6"></a-circle>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 -0.018" rotation="0 180 0" material="src: ./3d-boton-biblioteca.jpg; shader: standard; roughness: 0.6"></a-circle>
            </a-entity>
          </a-entity>
        </a-entity>
        <a-entity class="boton anim reiniciar" data-escala="0.3 0.3 0.01" position="0.36 -0.46 0" scale="0.3 0.3 0.01"
          animation__crecer="property: scale; from: 0.3 0.3 0.01; to: 1 1 1; dur: 700; delay: 2350; easing: easeOutBack; startEvents: aparecer">
          <a-image src="./3d-sombra.png" transparent="true" width="0.2" height="0.12" position="0 0 0.003" material="depthWrite: false"></a-image>
          <a-image src="#etqWeb" transparent="true" side="double" width="0.198" height="0.045" position="0 -0.02 0.035" rotation="90 0 0"></a-image>
          <a-entity position="0 0 0.16"
            animation__flotar="property: position; from: 0 0 0.15; to: 0 0 0.17; dur: 1400; delay: 600; dir: alternate; loop: true; easing: easeInOutSine">
            <a-entity rotation="90 0 0" data-url="https://unsm.edu.pe/"
              animation__balanceo="property: rotation; from: 90 -25 0; to: 90 25 0; dur: 1700; delay: 750; dir: alternate; loop: true; easing: easeInOutSine">
              <a-entity class="tocable" geometry="primitive: cylinder; radius: 0.08; height: 0.035; segmentsRadial: 48" rotation="90 0 0"
                caras="lado: #00953a; metal: 0.4"></a-entity>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 0.018" material="src: ./3d-boton-web.jpg; shader: standard; roughness: 0.6"></a-circle>
              <a-circle class="tocable" radius="0.079" segments="48" position="0 0 -0.018" rotation="0 180 0" material="src: ./3d-boton-web.jpg; shader: standard; roughness: 0.6"></a-circle>
            </a-entity>
          </a-entity>
        </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const escena    = document.querySelector('a-scene');
    const carne     = document.querySelector('#carne');
    const contenido = document.querySelector('#contenido');
    const aviso     = document.querySelector('#aviso');
    const ayuda     = document.querySelector('#ayuda');
    const ESPERA_AL_PERDER = 900;   // ms que el contenido se queda si el carné se pierde un momento
    let mostrando = false, timerPerdido, timerAviso, timerAyuda;

    document.querySelector('#btnIniciar').addEventListener('click', () => {
      document.querySelector('#inicio').style.display = 'none';
      const iniciar = () => escena.systems['mindar-image-system'].start();
      escena.hasLoaded ? iniciar() : escena.addEventListener('loaded', iniciar);
    });

    const seguidor = () => contenido.components['seguir-suave'];

    function reiniciar() {
      contenido.querySelectorAll('.reiniciar').forEach(el => {
        if (el.dataset.escala) el.setAttribute('scale', el.dataset.escala);
        if (el.dataset.pos) el.setAttribute('position', el.dataset.pos);
        if (el.dataset.rot) el.setAttribute('rotation', el.dataset.rot);
      });
    }

    carne.addEventListener('targetFound', () => {
      clearTimeout(timerPerdido);
      if (mostrando) { seguidor().seguir(false); return; }   // volvió rápido: sigue sin repetir la animación
      mostrando = true;
      seguidor().seguir(true);
      contenido.object3D.visible = true;
      contenido.querySelectorAll('.anim').forEach(el => el.emit('aparecer', null, false));
      aviso.classList.add('visible');
      clearTimeout(timerAviso); clearTimeout(timerAyuda);
      timerAviso = setTimeout(() => aviso.classList.remove('visible'), 1800);
      timerAyuda = setTimeout(() => { if (mostrando) { ayuda.classList.add('visible'); timerAyuda = setTimeout(() => ayuda.classList.remove('visible'), 3500); } }, 3000);
      if (navigator.vibrate) navigator.vibrate(60);
    });

    carne.addEventListener('targetLost', () => {
      seguidor().detener();                      // se queda congelado donde estaba
      timerPerdido = setTimeout(() => {          // si no vuelve pronto, se esconde
        mostrando = false;
        contenido.object3D.visible = false;
        ayuda.classList.remove('visible');
        reiniciar();
      }, ESPERA_AL_PERDER);
    });

    document.querySelectorAll('.boton').forEach(moneda =>
      moneda.setAttribute('animation__toque', 'property: scale; from: 1.3 1.3 1.3; to: 1 1 1; dur: 300; easing: easeOutQuad; startEvents: toque'));
    let ultimoToque = 0;
    document.querySelectorAll('.tocable').forEach(parte => {
      parte.addEventListener('click', () => {
        if (!mostrando || Date.now() - ultimoToque < 600) return;   // evita abrir dos veces con un solo toque
        ultimoToque = Date.now();
        parte.closest('.boton').emit('toque', null, false);
        const url = parte.closest('[data-url]').dataset.url;
        const ventana = window.open(url, '_blank');
        if (!ventana) window.location.href = url;
      });
    });
  </script>
</body>
</html>
