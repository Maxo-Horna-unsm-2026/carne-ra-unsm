<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Carné aumentado UNSM</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

    /* ---------- Pantalla de inicio ---------- */
    #inicio {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at 50% 30%, #17406f 0%, #0b2545 70%);
      color: #fff; text-align: center; padding: 28px;
    }
    #inicio img { width: 120px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); animation: flotar 3s ease-in-out infinite; }
    #inicio h1 { margin: 6px 0 0; font-size: 26px; }
    #inicio p { margin: 0; opacity: .85; max-width: 320px; line-height: 1.45; }
    #btnIniciar {
      margin-top: 10px; font-size: 18px; font-weight: 700; padding: 14px 34px;
      border: 0; border-radius: 999px; background: #f4b400; color: #0b2545;
      box-shadow: 0 6px 18px rgba(244,180,0,.4);
    }
    #inicio small { opacity: .6; margin-top: 8px; }
    @keyframes flotar { 50% { transform: translateY(-10px); } }

    /* ---------- Avisos arriba y abajo ---------- */
    .aviso {
      position: fixed; left: 50%; z-index: 20; transition: transform .35s ease;
      background: #0b2545; color: #fff; border: 2px solid #f4b400;
      padding: 10px 18px; border-radius: 999px; font-weight: 600; white-space: nowrap;
    }
    #aviso { top: 18px; transform: translate(-50%, -90px); }
    #aviso.visible { transform: translate(-50%, 0); }
    #ayuda { bottom: 22px; transform: translate(-50%, 120px); background: rgba(11,37,69,.9); font-weight: 500; }
    #ayuda.visible { transform: translate(-50%, 0); }

    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <!-- Pantalla de inicio -->
  <div id="inicio">
    <img src="./escudo.png" alt="Escudo UNSM">
    <h1>Carné aumentado UNSM</h1>
    <p>Toca <b>Comenzar</b>, permite el uso de la cámara y apunta a la parte delantera de tu carné universitario.</p>
    <button id="btnIniciar">Comenzar</button>
    <small>Ingeniería de Sistemas e Informática</small>
  </div>

  <div id="aviso" class="aviso">✅ Carné detectado</div>
  <div id="ayuda" class="aviso">👆 Toca un logo para abrirlo</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="imgEscudo" src="./escudo.png">
      <img id="imgPanel" src="./panel-facultad.png">
      <img id="icoIntranet" src="./icono-intranet.png">
      <img id="icoAula" src="./icono-aula.png">
      <img id="icoBiblioteca" src="./icono-biblioteca.png">
      <img id="icoWeb" src="./icono-web.png">
    </a-assets>

    <!-- cursor + raycaster: permiten tocar los logos con el dedo -->
    <a-camera position="0 0 0" look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .tocable"></a-camera>

    <!-- El carné mide 1 de ancho y 0,635 de alto. El centro del carné es (0, 0). -->
    <a-entity id="carne" mindar-image-target="targetIndex: 0">

      <!-- Marco dorado alrededor del carné -->
      <a-entity id="marco" class="reiniciar" data-escala="0.001 0.001 0.001" scale="0.001 0.001 0.001"
        animation__abrir="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 500; easing: easeOutQuad; startEvents: aparecer">
        <a-plane color="#f4b400" shader="flat" width="1.04" height="0.02" position="0 0.3275 0.002"></a-plane>
        <a-plane color="#f4b400" shader="flat" width="1.04" height="0.02" position="0 -0.3275 0.002"></a-plane>
        <a-plane color="#f4b400" shader="flat" width="0.02" height="0.675" position="0.51 0 0.002"></a-plane>
        <a-plane color="#f4b400" shader="flat" width="0.02" height="0.675" position="-0.51 0 0.002"></a-plane>
      </a-entity>

      <!-- Línea de "escaneo" que recorre el carné -->
      <a-plane id="escaneo" color="#f4b400" shader="flat" width="1" height="0.025" position="0 0.31 0.004"
        material="transparent: true; opacity: 0"
        animation__bajar="property: position; from: 0 0.31 0.004; to: 0 -0.31 0.004; dur: 900; easing: easeInOutQuad; startEvents: aparecer"
        animation__brillo="property: material.opacity; from: 0.85; to: 0; dur: 900; easing: easeInQuad; startEvents: aparecer">
      </a-plane>

      <!-- Escudo UNSM: sale de la zona de la foto del carné y se balancea -->
      <a-entity id="escudo" class="reiniciar" data-escala="0.01 0.01 0.01" data-pos="-0.3 -0.02 0.01"
        position="-0.3 -0.02 0.01" scale="0.01 0.01 0.01"
        animation__salir="property: position; from: -0.3 -0.02 0.01; to: -0.3 0 0.18; dur: 1000; delay: 300; easing: easeOutBack; startEvents: aparecer"
        animation__crecer="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 1000; delay: 300; easing: easeOutBack; startEvents: aparecer">
        <a-image src="#imgEscudo" transparent="true" width="0.34" height="0.40"
          animation__balanceo="property: rotation; from: 0 -22 0; to: 0 22 0; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine"
          animation__flotar="property: position; from: 0 -0.015 0; to: 0 0.015 0; dur: 1400; dir: alternate; loop: true; easing: easeInOutSine">
        </a-image>
      </a-entity>

      <!-- Panel de la facultad: aparece encima del carné -->
      <a-entity id="panel" class="reiniciar" data-escala="0.01 0.01 0.01"
        position="0 0.56 0.02" scale="0.01 0.01 0.01"
        animation__crecer="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 700; delay: 900; easing: easeOutBack; startEvents: aparecer">
        <a-image src="#imgPanel" transparent="true" width="0.95" height="0.4"></a-image>
      </a-entity>

      <!-- Logos de acceso: aparecen uno por uno debajo del carné. Para cambiar un link, edita data-url -->
      <a-entity id="logos" position="0 -0.52 0.06">
        <a-entity class="logo reiniciar" data-escala="0.01 0.01 0.01" position="-0.375 0 0" scale="0.01 0.01 0.01"
          animation__crecer="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; delay: 1300; easing: easeOutBack; startEvents: aparecer">
          <a-image class="tocable" src="#icoIntranet" transparent="true" width="0.23" height="0.27"
            data-url="https://sigauintranet.unsm.edu.pe/"
            animation__flotar="property: position; from: 0 -0.012 0; to: 0 0.012 0; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        </a-entity>
        <a-entity class="logo reiniciar" data-escala="0.01 0.01 0.01" position="-0.125 0 0" scale="0.01 0.01 0.01"
          animation__crecer="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; delay: 1450; easing: easeOutBack; startEvents: aparecer">
          <a-image class="tocable" src="#icoAula" transparent="true" width="0.23" height="0.27"
            data-url="https://campusvirtualpregrado.unsm.edu.pe/"
            animation__flotar="property: position; from: 0 -0.012 0; to: 0 0.012 0; dur: 1500; delay: 200; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        </a-entity>
        <a-entity class="logo reiniciar" data-escala="0.01 0.01 0.01" position="0.125 0 0" scale="0.01 0.01 0.01"
          animation__crecer="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; delay: 1600; easing: easeOutBack; startEvents: aparecer">
          <a-image class="tocable" src="#icoBiblioteca" transparent="true" width="0.23" height="0.27"
            data-url="http://biblioteca.unsm.edu.pe/"
            animation__flotar="property: position; from: 0 -0.012 0; to: 0 0.012 0; dur: 1500; delay: 400; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        </a-entity>
        <a-entity class="logo reiniciar" data-escala="0.01 0.01 0.01" position="0.375 0 0" scale="0.01 0.01 0.01"
          animation__crecer="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; delay: 1750; easing: easeOutBack; startEvents: aparecer">
          <a-image class="tocable" src="#icoWeb" transparent="true" width="0.23" height="0.27"
            data-url="https://unsm.edu.pe/"
            animation__flotar="property: position; from: 0 -0.012 0; to: 0 0.012 0; dur: 1500; delay: 600; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector('a-scene');
    const carne  = document.querySelector('#carne');
    const aviso  = document.querySelector('#aviso');
    const ayuda  = document.querySelector('#ayuda');
    let timerAviso, timerAyuda, visible = false;

    // Botón "Comenzar": recién aquí se enciende la cámara
    document.querySelector('#btnIniciar').addEventListener('click', () => {
      document.querySelector('#inicio').style.display = 'none';
      const iniciar = () => escena.systems['mindar-image-system'].start();
      escena.hasLoaded ? iniciar() : escena.addEventListener('loaded', iniciar);
    });

    // Cuando la cámara encuentra el carné: arranca la animación
    carne.addEventListener('targetFound', () => {
      visible = true;
      carne.querySelectorAll('[animation__abrir],[animation__bajar],[animation__salir],[animation__crecer]')
           .forEach(el => el.emit('aparecer', null, false));
      aviso.classList.add('visible');
      clearTimeout(timerAviso); clearTimeout(timerAyuda);
      timerAviso = setTimeout(() => aviso.classList.remove('visible'), 1800);
      timerAyuda = setTimeout(() => { if (visible) ayuda.classList.add('visible'); }, 2400);
      if (navigator.vibrate) navigator.vibrate(60);
    });

    // Cuando la cámara pierde el carné: se esconde todo para repetir la animación
    carne.addEventListener('targetLost', () => {
      visible = false;
      ayuda.classList.remove('visible');
      carne.querySelectorAll('.reiniciar').forEach(el => {
        el.setAttribute('scale', el.dataset.escala);
        if (el.dataset.pos) el.setAttribute('position', el.dataset.pos);
      });
    });

    // Tocar un logo: pequeño "salto" y se abre el sitio
    document.querySelectorAll('.tocable').forEach(logo => {
      logo.setAttribute('animation__toque', 'property: scale; from: 1.3 1.3 1.3; to: 1 1 1; dur: 300; easing: easeOutQuad; startEvents: toque');
      logo.addEventListener('click', () => {
        if (!visible) return;
        logo.emit('toque', null, false);
        const url = logo.dataset.url;
        const ventana = window.open(url, '_blank');
        if (!ventana) window.location.href = url;   // si el navegador bloquea la pestaña nueva
      });
    });
  </script>
</body>
</html>
